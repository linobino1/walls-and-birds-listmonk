#: schema https://json.schemastore.org/fly.json
app = 'walls-and-birds-listmonk'
primary_region = 'fra'

[deploy]
strategy = "bluegreen"

[build.args]
PORT = '9000'

[http_service]
internal_port = 9000
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'requests'
hard_limit = 250
soft_limit = 200

[[http_service.checks]]
interval = '10s'
timeout = '5s'
grace_period = '5s'
method = 'GET'
path = '/health'
tls_skip_verify = true

[[vm]]
cpu_kind = 'shared'
cpus = 1
memory_mb = 256
